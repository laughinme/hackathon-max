services:
  bot:
    build: ./backend
    image: domovoy-backend:latest
    container_name: domovoy-bot
    restart: unless-stopped
    env_file:
      - ./backend/.env
    stop_grace_period: 10s
    # Прототип работает по long polling; целевая схема — webhook за Caddy
    # (см. docs/ARCHITECTURE.md), тогда здесь появятся caddy и postgres.
