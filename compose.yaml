# One command for the checkers: `docker compose up --build` (polling mode).
# Production on the VPS: `docker compose --profile prod up -d --build`
# with BOT_MODE=webhook, WEBHOOK_URL, WEBHOOK_SECRET in backend/.env and
# DOMAIN in the shell or a root .env file.

services:
  db:
    image: postgres:17-alpine
    container_name: domovoy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: domovoy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domovoy}
      POSTGRES_DB: domovoy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domovoy -d domovoy"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    # Repo root as context: the image also builds the mini-app (frontend/).
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: domovoy-backend:latest
    container_name: domovoy-bot
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Service names inside the compose network override localhost from .env.
      DATABASE_URL: postgresql+asyncpg://domovoy:${POSTGRES_PASSWORD:-domovoy}@db:5432/domovoy
      ML_SERVICE_URL: http://ml:8100
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_started
    stop_grace_period: 10s

  ml:
    build: ./ml
    image: domovoy-ml:latest
    container_name: domovoy-ml
    restart: unless-stopped
    env_file:
      - path: ./ml/.env
        required: false
    volumes:
      # Trained models are dropped here without rebuilding the image
      # (DECISIONS D-006); until then /classify answers 503 and the bot
      # falls back to keyword rules.
      - ./ml/models:/app/models:ro
    stop_grace_period: 10s

  caddy:
    image: caddy:2.10-alpine
    container_name: domovoy-caddy
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}  # required for the prod profile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  pgdata:
  caddy_data:
  caddy_config:
